services:
  postgres:
    image: postgres:17-alpine
    container_name: bilik_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: bilik_user
      POSTGRES_PASSWORD: bilik_password
      POSTGRES_DB: bilik_db
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - bilik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilik_user -d bilik_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bilik_pgdata:
    name: bilik_postgres_dev_data
